[project]
name = "padelbook"
version = "0.1.0"
description = "Padel club booking management system"
requires-python = ">=3.14"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padelbook"]